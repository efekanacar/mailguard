[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailguard-eml"
version = "0.1.0"
description = "Offline email header triage and Cuckoo sandbox submission"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mailguard = "mailguard.cli:main"

[tool.setuptools.packages.find]
include = ["mailguard*"]
